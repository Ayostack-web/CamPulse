services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: api-lean
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage
      - api_tmp:/app/tmp
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      target: worker
    env_file:
      - .env.production
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - api_storage:/app/storage
      - api_tmp:/app/tmp

  beat:
    build:
      context: ./apps/api
      target: worker
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env.production
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  api_storage:
  api_tmp:
  caddy_data:
  caddy_config:
